<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rebaño de Incógnito</title>
<meta name="description" content="Juego de cartas online: junta rebaños de alpacas disfrazadas y sobrevive a los depredadores andinos.">
<link rel="icon" href="img/back.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800&family=DM+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: mesa de una pantalla — rivales arriba, mesa de fieltro cosido al centro, tu mano en abanico abajo, bitácora a la derecha (debajo en móvil) */
:root{
  --bg:#e4eadb; --bg-2:#d6dfca; --ink:#1f2619; --muted:#5a6450; --line:#c0caaf;
  --panel:#f6f8f0; --paper:#fffaf0; --card-ink:#2a2620;
  --felt:#4c7a37; --felt-2:#3f6a2d; --on-felt:#f3f7ea; --stitch:rgba(255,255,255,.45); --rim:#7b5232;
  --accent:#3446d6; --accent-ink:#ffffff; --gold:#e8ad1f;
  --danger:#c72f2a; --ok:#2e7d3a; --shadow:0 3px 0 rgba(31,38,25,.18);
  --f-display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --cw:92px; --ch:128px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10150e; --bg-2:#171e14; --ink:#ecf0e2; --muted:#a3ac93; --line:#323c29;
  --panel:#1a2216; --paper:#fffaf0; --card-ink:#2a2620;
  --felt:#2d4b22; --felt-2:#243e1b; --on-felt:#eef4e2; --stitch:rgba(255,255,255,.28); --rim:#4a3220;
  --accent:#8f9bff; --accent-ink:#10150e; --gold:#f4c24a;
  --danger:#ff6b60; --ok:#7fd08a; --shadow:0 3px 0 rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10150e; --bg-2:#171e14; --ink:#ecf0e2; --muted:#a3ac93; --line:#323c29;
  --panel:#1a2216; --paper:#fffaf0; --card-ink:#2a2620;
  --felt:#2d4b22; --felt-2:#243e1b; --on-felt:#eef4e2; --stitch:rgba(255,255,255,.28); --rim:#4a3220;
  --accent:#8f9bff; --accent-ink:#10150e; --gold:#f4c24a;
  --danger:#ff6b60; --ok:#7fd08a; --shadow:0 3px 0 rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(1200px 500px at 50% -10%,var(--bg-2),transparent 70%),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px}
.logo{width:44px;height:44px;flex:none;border-radius:14px;background:var(--felt);display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--felt),inset 0 0 0 4.5px var(--stitch),var(--shadow)}
.logo svg{width:36px;height:auto}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.3px;line-height:1;margin:0;font-weight:400}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:5px}
.top .stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{font-family:var(--f-mono);font-size:12px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);white-space:nowrap}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:12px;padding:8px 15px;font-weight:800;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--gold);border-color:var(--gold);color:#2a1d00}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 11px;font-size:13px}

/* grid */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media (max-width:960px){.game{grid-template-columns:minmax(0,1fr)}}
.zone{min-width:0;display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* rivals */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.opp{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0;position:relative;transition:border-color .2s,box-shadow .2s}
.opp.turn{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#fff;background:var(--av);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.who .nm{font-weight:800;font-size:15px;line-height:1.1}
.who .sub{font-size:12px;color:var(--muted)}
.turnflag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#2a1d00;padding:3px 8px;border-radius:999px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.backs{display:flex;align-items:flex-end;margin-left:auto;height:30px}
.backs i{width:18px;height:26px;border-radius:4px;margin-left:-11px;border:1.5px solid #fff;background:repeating-linear-gradient(60deg,#3f6a2d 0 4px,#4c7a37 4px 8px);box-shadow:0 1px 2px rgba(0,0,0,.25);transform:rotate(var(--r))}
.backs i:first-child{margin-left:0}
.pips{display:flex;gap:4px;align-items:center}
.pips b{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:transparent}
.pips b.on{background:var(--ok);border-color:var(--ok)}
.pips b.warn{background:var(--danger);border-color:var(--danger)}
.flocks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:34px;align-items:center}
.empty{font-size:12px;color:var(--muted);font-style:italic}

/* flock stack */
.flock{display:inline-flex;align-items:center;gap:7px;padding:4px 9px 4px 5px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,var(--panel));border:2px solid color-mix(in srgb,var(--c) 55%,transparent);font-size:12px;font-weight:800}
.flock.new{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.flock{padding:5px 10px 5px 6px}
.flock .stk{display:flex;padding:2px 4px 2px 2px}
.flock .stk i{width:34px;height:44px;border-radius:7px;flex:none;overflow:hidden;display:grid;place-items:center;margin-left:-20px;border:2px solid var(--c);background:radial-gradient(circle at 50% 45%,#fff 0 35%,color-mix(in srgb,var(--c) 26%,#fffaf0) 80%);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.flock .stk i svg{width:54px;height:auto;display:block;margin-left:16px;margin-top:4px}
.flock .stk i:first-child{margin-left:0;transform:rotate(-9deg)}
.flock .stk i:nth-child(2){transform:translateY(-3px);z-index:1}
.flock .stk i:last-child{transform:rotate(9deg);z-index:2}
.flock .fl{display:flex;flex-direction:column;line-height:1.15}
.flock.wild{--c:#5d6550}
.flock.exposed .stk i{filter:saturate(.7);border-color:var(--danger)}
.flock.exposed{border-style:dashed;border-color:var(--danger);background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--danger) 14%,var(--panel)) 0 6px,var(--panel) 6px 12px)}
.flock .eye{font-size:10px;letter-spacing:.05em;color:var(--danger);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 8px 3px 4px;font-size:12px;font-weight:800;background:var(--paper);color:var(--card-ink);border:2px solid var(--c)}
.chip .dot{width:18px;height:18px;border-radius:5px;background:var(--c);display:grid;place-items:center;color:#fff;font-size:10px}
.chip.exposed{border-style:dashed;border-color:var(--danger)}
.chip .tag{font-size:9px;letter-spacing:.06em;color:#b3241f}

/* felt table */
.table{position:relative;border-radius:24px;padding:18px 20px 20px;color:var(--on-felt);
  background:radial-gradient(120% 90% at 50% 40%,var(--felt),var(--felt-2));
  box-shadow:inset 0 0 0 6px var(--rim),inset 0 0 0 9px color-mix(in srgb,var(--rim) 60%,#000),inset 0 0 40px rgba(0,0,0,.35),0 6px 0 rgba(0,0,0,.18);
  display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.table::before{content:"";position:absolute;inset:16px;border:2px dashed var(--stitch);border-radius:14px;pointer-events:none}
.table .label{color:color-mix(in srgb,var(--on-felt) 80%,transparent);position:relative}
.table>div{position:relative}
.pileset{display:flex;gap:16px}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--on-felt)}
.deckstack{position:relative}
.deckstack::before,.deckstack::after{content:"";position:absolute;inset:0;border-radius:12px;background:#2e4a22;border:2px solid #fffaf0}
.deckstack::before{transform:translate(4px,4px)}
.deckstack::after{transform:translate(2px,2px)}
.deckstack .card{position:relative;z-index:1}
.field{display:flex;gap:12px;flex-wrap:wrap}

/* cards */
.card{width:var(--cw);height:var(--ch);border-radius:12px;background:var(--paper);color:var(--card-ink);border:none;position:relative;display:flex;flex-direction:column;align-items:stretch;padding:6px;box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.18);flex:none;transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s;text-align:center;overflow:hidden}
.card::after{content:"";position:absolute;inset:4px;border-radius:9px;border:1.5px dashed var(--st,rgba(0,0,0,.18));pointer-events:none}
.card .corner{position:absolute;top:7px;left:8px;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.04em;z-index:1}
.card .nm{font-family:var(--f-display);font-size:13px;line-height:1.05;margin-top:auto;padding:5px 4px 4px;border-radius:7px;position:relative;z-index:1}
.card.sheep{--st:color-mix(in srgb,var(--c) 45%,transparent);background:radial-gradient(circle at 50% 42%,#fff 0 28%,color-mix(in srgb,var(--c) 22%,#fffaf0) 70%),#fffaf0}
.card.sheep .corner{color:var(--c)}
.card.sheep .art{display:block;margin:14px -4px 0}
.card.sheep svg{width:100%;height:auto;display:block}
.card.sheep .nm{background:var(--c);color:#fff}
.card.action{--st:rgba(255,255,255,.35);background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.18),transparent 55%),linear-gradient(165deg,var(--a1),var(--a2));color:#fff;--a1:#4352e6;--a2:#232c8c}
.card.action.nice{--a1:#14a37f;--a2:#0a5a46}
.card.action.expose{--a1:#e06a2a;--a2:#8c3210}
.card.action .corner{color:rgba(255,255,255,.8)}
.card.action .glyph{width:44px;height:44px;border-radius:50%;margin:16px auto 2px;background:#fffaf0;color:var(--a2);display:grid;place-items:center;font-family:var(--f-display);font-size:21px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.card.action .nm{margin-top:4px;font-size:12.5px}
.card.action .cf{font-size:8.5px;line-height:1.15;opacity:.88;margin-top:auto;padding:0 2px 2px}
.card.attack{--st:rgba(255,120,100,.4);background:radial-gradient(circle at 50% 35%,#8a1f17,#2a0806 75%);color:#ffe3dc}
.card.attack .corner{color:#ff9a8c}
.card.attack .claw{width:64%;margin:16px auto 0;display:block}
.card.attack .nm{font-size:16px;color:#ff8b7e;margin-top:2px}
.card.attack .cf{font-size:8px;line-height:1.15;opacity:.8;margin-top:auto}
.card.back{--st:rgba(255,255,255,.5);background:repeating-linear-gradient(60deg,#3f6a2d 0 6px,#4c7a37 6px 12px),#4c7a37;display:grid;place-items:center}
.card.back::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-60deg,transparent 0 6px,rgba(0,0,0,.08) 6px 12px)}
.card.back span{position:relative;font-family:var(--f-display);color:#fffaf0;font-size:22px;background:#2e4a22;border:2px solid #fffaf0;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
.card.ghost{background:transparent;box-shadow:none}
.card.ghost::after{border-color:var(--stitch);border-width:2px}
.card.enter{animation:deal .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes deal{from{transform:translateY(-40px) rotate(-12deg) scale(.7);opacity:0}}
@keyframes pop{from{transform:scale(.5);opacity:0}}

/* me */
.me{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:14px 16px;transition:border-color .2s,box-shadow .2s}
.me.turn{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.me-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.me-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.me-head .pips{margin-left:auto}
.hand{display:flex;flex-wrap:wrap;gap:10px 0;margin-top:14px;padding:18px 8px 4px 22px;min-height:calc(var(--ch) + 30px)}
.hand .card{cursor:pointer;margin-left:var(--ov,-14px);transform:rotate(var(--r,0deg)) translateY(var(--y,0px))}
.hand .card:hover{transform:rotate(0deg) translateY(-14px);z-index:5}
.hand .card.sel{transform:rotate(0deg) translateY(-20px);box-shadow:0 0 0 3px var(--gold),0 12px 18px rgba(0,0,0,.25);z-index:4}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.hint{font-size:13px;color:var(--muted);flex-basis:100%;margin:0}
.hint b{color:var(--ink)}
@media (max-width:640px){
  :root{--cw:72px;--ch:102px}
  .card .nm{font-size:11px}.card.action .glyph{width:34px;height:34px;font-size:16px;margin-top:14px}.card.action .cf,.card.attack .cf{display:none}
  .hand{padding-left:16px}.hand .card{--ov:-18px}
  .bar{position:sticky;bottom:0;background:var(--panel);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-radius:0 0 20px 20px;z-index:6}
}

/* log */
.log{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;max-height:760px;overflow:auto;font-size:13px;min-width:0;align-self:start;position:sticky;top:12px}
@media (max-width:960px){.log{max-height:260px;position:static}}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{padding:2px 0 6px 14px;border-bottom:1px solid var(--line);position:relative}
.log li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--line)}
.log li.turnl{font-weight:800;color:var(--accent);border-bottom:none;margin-top:6px}
.log li.turnl::before{background:var(--accent)}
.log li.atk{color:var(--danger);font-weight:600}.log li.atk::before{background:var(--danger)}
.log li.flk::before{background:var(--ok)}
.log li.win{color:var(--ok);font-weight:800}.log li.win::before{background:var(--ok)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(12,16,10,.6);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:22px;padding:20px;max-width:660px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.sheet h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:24px;text-wrap:balance}
.sheet p{margin:0 0 12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--bg);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt.ghost{background:transparent;color:var(--muted)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.picker{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px;padding:14px;border-radius:16px;background:radial-gradient(120% 90% at 50% 40%,var(--felt),var(--felt-2))}
.picker .card{cursor:pointer}
.picker .card:hover{transform:translateY(-4px)}
.picker .card.sel{box-shadow:0 0 0 3px var(--gold);transform:translateY(-6px)}
.rules h4{margin:16px 0 4px;font-size:14px}
.rules ul{margin:0;padding-left:18px}.rules li{margin:3px 0}
.rules table{border-collapse:collapse;font-size:13px;width:100%}
.rules td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
.tbl{overflow-x:auto}

/* banner + toasts */
#banner{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none;background:radial-gradient(circle,rgba(120,10,6,.45),rgba(20,0,0,.7))}
#banner .inner{display:flex;gap:18px;align-items:center;color:#ffe6df;max-width:min(560px,92vw);padding:0 16px;animation:slam .5s cubic-bezier(.2,1.5,.4,1)}
#banner .inner h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,52px);color:#ff8d80;line-height:1;text-shadow:0 4px 0 #3a0703}
#banner .inner p{margin:8px 0 0;font-size:16px;font-weight:600}
#banner .card{--cw:110px;--ch:154px;transform:rotate(-6deg)}
@keyframes slam{from{transform:scale(1.6) rotate(6deg);opacity:0}}
#toasts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .35s cubic-bezier(.2,1.4,.4,1) both;text-align:center}
.toast.atk{background:var(--danger);color:#fff}
.toast.flk{background:var(--ok);color:#fff}
.toast.turn{background:var(--gold);color:#2a1d00;font-family:var(--f-display);font-weight:400;font-size:18px}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;margin-top:18px;align-items:center}
@media (max-width:840px){.setup{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,6vw,62px);line-height:.98;margin:0 0 14px;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--danger)}
.hero p{max-width:56ch;margin:0 0 12px;color:var(--muted);font-size:16px}
.stage{margin-top:22px;border-radius:24px;padding:28px 16px 34px;background:radial-gradient(120% 90% at 50% 40%,var(--felt),var(--felt-2));box-shadow:inset 0 0 0 6px var(--rim),inset 0 0 40px rgba(0,0,0,.35);position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:14px;border:2px dashed var(--stitch);border-radius:14px}
.fan{display:flex;justify-content:center;position:relative}
.fan .card{margin-left:-26px;transform:rotate(var(--r)) translateY(var(--y));animation:float 4s ease-in-out infinite;animation-delay:var(--d)}
.fan .card:first-child{margin-left:0}
@keyframes float{50%{translate:0 -6px}}
.panel{border:2px solid var(--ink);border-radius:22px;padding:22px;background:var(--panel);box-shadow:0 8px 0 rgba(0,0,0,.12)}
